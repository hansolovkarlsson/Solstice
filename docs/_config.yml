title: Solstice
description: >-
  A Wirth-style Pascal compiler (pascalc) and a classic-BASIC compiler
  (basicc), both targeting one custom stack-based virtual machine
  (SolVM) designed from scratch.

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

url: "https://hansolovkarlsson.github.io"
baseurl: "/Solstice"

color_scheme: light
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Solstice on GitHub":
    - "https://github.com/hansolovkarlsson/Solstice"
aux_links_new_tab: true

footer_content: >-
  Solstice is a personal toolchain project - source and issues on
  <a href="https://github.com/hansolovkarlsson/Solstice">GitHub</a>.

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      nav_enabled: true
